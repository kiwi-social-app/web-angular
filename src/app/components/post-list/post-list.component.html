<div class="post-list-component">
  <h1>Home</h1>
  <div class="controls">
    <button
      class="new-post-btn"
      color="primary"
      mat-button
      mat-flat-button
      type="button"
      (click)="openNewPostModal()"
    >
      New Post
    </button>
    <button type="button" mat-icon-button (click)="filterSelect()">
      <mat-icon>filter_list</mat-icon>
    </button>
  </div>

  @if (posts.error() || currentUser.error()) {
    <app-state-message
      role="alert"
      icon="error_outline"
      heading="Couldn't load posts"
      message="Check your connection and try again."
    >
      <button mat-stroked-button type="button" (click)="reload()">
        Try again
      </button>
    </app-state-message>
  } @else if (posts.hasValue() && currentUser.hasValue()) {
    @for (post of sortedPosts(); track post.id) {
      <div class="card-container">
        <app-post-card
          [currentUserId]="currentUser.value()?.id"
          [post]="post"
          (deleted)="posts.reload()"
        />
      </div>
    } @empty {
      <app-state-message
        icon="dynamic_feed"
        heading="No posts yet"
        message="Be the first to share something with New Post."
      />
    }
  } @else {
    <app-loading-state label="Loading posts…" />
  }
</div>

<nav class="navbar" aria-label="Main">
  <a class="brand" routerLink="/">Kiwi Social</a>
  <ul class="links">
    <li>
      <a
        class="link"
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
      >
        <mat-icon>home</mat-icon>
        <span class="label">Home</span>
      </a>
    </li>
    @if (searchEnabled) {
      <li>
        <a
          class="link"
          routerLink="/search"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
        >
          <mat-icon>search</mat-icon>
          <span class="label">Search</span>
        </a>
      </li>
    }
    <li>
      <a
        class="link"
        routerLink="/chat"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <mat-icon>chat_bubble</mat-icon>
        <span class="label">Chat</span>
      </a>
    </li>
    <li>
      <a
        class="link"
        routerLink="/saved-posts"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <mat-icon>bookmark</mat-icon>
        <span class="label">Saved</span>
      </a>
    </li>
    <li>
      <button type="button" class="link" [matMenuTriggerFor]="accountMenu">
        <mat-icon>account_circle</mat-icon>
        <span class="label">Account</span>
      </button>
    </li>
  </ul>
</nav>

<mat-menu #accountMenu="matMenu">
  <a mat-menu-item routerLink="/dashboard">
    <mat-icon>person</mat-icon>
    <span>Your profile</span>
  </a>
  <button mat-menu-item type="button" [matMenuTriggerFor]="themeMenu">
    <mat-icon>{{ themeIcon() }}</mat-icon>
    <span>Theme</span>
  </button>
  <mat-divider />
  <button mat-menu-item type="button" (click)="signOut()">
    <mat-icon>logout</mat-icon>
    <span>Sign out</span>
  </button>
</mat-menu>

<mat-menu #themeMenu="matMenu">
  @for (option of themeOptions; track option.mode) {
    <button
      mat-menu-item
      type="button"
      role="menuitemradio"
      [attr.aria-checked]="themeService.mode() === option.mode"
      (click)="themeService.setMode(option.mode)"
    >
      <mat-icon>{{ option.icon }}</mat-icon>
      <span>{{ option.label }}</span>
      @if (themeService.mode() === option.mode) {
        <mat-icon class="theme-check" aria-hidden="true">check</mat-icon>
      }
    </button>
  }
</mat-menu>

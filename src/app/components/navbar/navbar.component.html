<nav class="top-bar">
  <a class="navbar-brand" routerLink="/">Kiwi Social</a>
  <div class="nav-links">
    <a
      routerLink=""
      class="nav-link"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      <mat-icon>home</mat-icon>
      <span class="sidebar-link-text">Home</span></a
    >
    @if (searchEnabled) {
      <a
        routerLink="search"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        class="nav-link"
      >
        <mat-icon>search</mat-icon>
        <span class="sidebar-link-text">Search</span>
      </a>
    }
    <a
      routerLink="chat"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      class="nav-link"
    >
      <mat-icon>chat_bubble</mat-icon>
      <span class="sidebar-link-text">Chat</span></a
    >
    <a
      routerLink="/saved-posts"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      class="nav-link top-bar-button"
    >
      <mat-icon>bookmark</mat-icon>
      <span class="sidebar-link-text">Saved Posts</span></a
    >
    <button
      mat-icon-button
      class="theme-toggle"
      [matMenuTriggerFor]="themeMenu"
      aria-label="Choose colour theme"
    >
      <mat-icon>{{ themeIcon() }}</mat-icon>
    </button>
    <mat-menu #themeMenu="matMenu">
      @for (option of themeOptions; track option.mode) {
        <button
          mat-menu-item
          role="menuitemradio"
          [attr.aria-checked]="themeService.mode() === option.mode"
          (click)="themeService.setMode(option.mode)"
        >
          <mat-icon>{{ option.icon }}</mat-icon>
          <span>{{ option.label }}</span>
          @if (themeService.mode() === option.mode) {
            <mat-icon class="theme-check" aria-hidden="true">check</mat-icon>
          }
        </button>
      }
    </mat-menu>
    <a
      routerLink="/dashboard"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      class="nav-link top-bar-button"
    >
      <mat-icon>person</mat-icon>
      <span class="sidebar-link-text">Account</span>
    </a>
  </div>
</nav>

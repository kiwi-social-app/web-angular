@if (post.hasValue() && comments.hasValue()) {
  @let currentPost = post.value()!;

  <div class="post-detail-component">
    <h1>Post</h1>
    <div class="post-container">
      <div class="text-content">
        <header class="post-header">
          <app-avatar [name]="currentPost.author.username" />
          <div class="meta">
            <a
              class="author-link"
              [routerLink]="['/profile', currentPost.author.id]"
            >
              {{ currentPost.author.username ?? "no username" }}
            </a>
            <time class="time" [attr.datetime]="currentPost.createdAt">{{
              currentPost.createdAt | date: "medium"
            }}</time>
          </div>
        </header>
        <p class="post-body">{{ currentPost.body }}</p>
      </div>
      <div class="actions">
        <button mat-button type="button">
          <mat-icon>bookmark_border</mat-icon>
          Save
        </button>
        <button
          mat-button
          type="button"
          [attr.aria-expanded]="replyInput"
          (click)="onReplyInputDisplayChange()"
        >
          <mat-icon>chat_bubble_outline</mat-icon>
          Comment
        </button>
        <button mat-button type="button">
          <mat-icon>share</mat-icon>
          Share
        </button>
      </div>
    </div>
    @if (replyInput) {
      <app-new-comment
        [replyInputDisplay]="replyInput"
        (onNewComment)="handleNewComment()"
        (replyInputDisplayChange)="onReplyInputDisplayChange()"
      ></app-new-comment>
    }
    <div class="scroll-container">
      <app-comment-list
        [comments]="sortedComments()"
        [postID]="currentPost.id"
      ></app-comment-list>
    </div>
  </div>
}

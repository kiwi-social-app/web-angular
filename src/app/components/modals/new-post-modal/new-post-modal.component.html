<h2 mat-dialog-title>New post</h2>
<form [formGroup]="newPostForm" (ngSubmit)="publish()">
  <mat-dialog-content>
    <mat-form-field class="body-field">
      <mat-label>What's on your mind?</mat-label>
      <textarea matInput rows="8" formControlName="body"></textarea>
      <mat-error>Write something to post</mat-error>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancel</button>
    <button mat-flat-button type="submit" [disabled]="pending()">
      {{ pending() ? "Posting…" : "Post" }}
    </button>
  </mat-dialog-actions>
</form>

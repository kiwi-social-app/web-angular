<h2 mat-dialog-title>New chat</h2>
<mat-dialog-content>
  @if (users.error()) {
    <app-state-message
      role="alert"
      icon="error_outline"
      heading="Couldn't load people"
    >
      <button mat-stroked-button type="button" (click)="users.reload()">
        Try again
      </button>
    </app-state-message>
  } @else if (users.hasValue()) {
    <mat-selection-list
      #usersList
      aria-label="People"
      (selectionChange)="selected.set(usersList.selectedOptions.selected)"
    >
      @for (user of otherUsers(); track user.id) {
        <mat-list-option [value]="user.id">
          {{ user.username ?? user.email }}
        </mat-list-option>
      } @empty {
        <p class="empty">There's no one else to chat with yet.</p>
      }
    </mat-selection-list>
  } @else {
    <app-loading-state label="Loading people…" />
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>Cancel</button>
  <button
    mat-flat-button
    type="button"
    [disabled]="selected().length === 0"
    (click)="confirm()"
  >
    Start chat
  </button>
</mat-dialog-actions>

<form
  class="new-comment-form"
  [formGroup]="newCommentForm"
  (ngSubmit)="createComment()"
>
  <mat-form-field>
    <mat-label>Comment</mat-label>
    <textarea matInput rows="4" formControlName="body"></textarea>
    <mat-error>Write something to comment</mat-error>
  </mat-form-field>
  <div class="actions">
    <button mat-button type="button" (click)="closeInput()">Cancel</button>
    <button mat-flat-button type="submit" [disabled]="pending()">
      {{ pending() ? "Commenting…" : "Comment" }}
    </button>
  </div>
</form>

<div class="new-comment-component">
  <div class="top-row">
    <button
      mat-icon-button
      type="button"
      aria-label="Close comment form"
      (click)="closeInput()"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <form
    class="new-comment-form"
    [formGroup]="newCommentForm"
    (ngSubmit)="createComment()"
  >
    <div class="form-block">
      <textarea
        class="body-input"
        id="comment"
        aria-label="Comment"
        formControlName="body"
      ></textarea>
    </div>
    <button class="publish-btn" type="submit">Publish Comment</button>
  </form>
</div>

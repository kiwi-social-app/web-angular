<article class="post-card">
  <header class="header">
    <app-avatar [name]="post.author.username" />
    <div class="meta">
      <a class="author-link" [routerLink]="['/profile', post.author.id]">
        {{ post.author.username }}
      </a>
      <time
        class="time"
        [attr.datetime]="post.createdAt"
        [matTooltip]="post.createdAt | date: 'medium'"
        >{{ post.createdAt | relativeTime }}</time
      >
    </div>
    @if (isOwner) {
      <button
        mat-icon-button
        type="button"
        class="owner-menu"
        aria-label="Post options"
        [matMenuTriggerFor]="ownerMenu"
      >
        <mat-icon>more_vert</mat-icon>
      </button>
      <mat-menu #ownerMenu="matMenu" xPosition="before">
        <a mat-menu-item [routerLink]="['/post-edit', post.id]">
          <mat-icon>edit</mat-icon>
          <span>Edit</span>
        </a>
        <button mat-menu-item type="button" (click)="deletePost()">
          <mat-icon>delete</mat-icon>
          <span>Delete</span>
        </button>
      </mat-menu>
    }
  </header>
  <p class="post-body">
    <a class="post-link" [routerLink]="['/posts', post.id]">{{ post.body }}</a>
  </p>
  <div class="actions">
    @if (currentUserId) {
      <button
        mat-icon-button
        type="button"
        aria-label="Like"
        [attr.aria-pressed]="isLiked"
        (click)="isLiked ? removeLike(post.id) : addLike(post.id)"
      >
        <mat-icon
          [class.like-btn]="isLiked"
          [fontSet]="isLiked ? 'material-icons' : 'material-icons-outlined'"
          >thumb_up</mat-icon
        >
      </button>
      <button
        mat-icon-button
        type="button"
        aria-label="Dislike"
        [attr.aria-pressed]="isDisliked"
        (click)="isDisliked ? removeDislike(post.id) : addDislike(post.id)"
      >
        <mat-icon
          [class.dislike-btn]="isDisliked"
          [fontSet]="isDisliked ? 'material-icons' : 'material-icons-outlined'"
          >thumb_down</mat-icon
        >
      </button>
      <button
        mat-button
        type="button"
        [attr.aria-pressed]="isFavorite"
        (click)="
          isFavorite ? removeFromFavorites(post.id) : addToFavorites(post.id)
        "
      >
        <mat-icon [class.save-btn]="isFavorite">{{
          isFavorite ? "bookmark" : "bookmark_border"
        }}</mat-icon>
        <span class="action-label">Save</span>
      </button>
    }

    <a mat-button [routerLink]="['/posts', post.id]">
      <mat-icon>chat_bubble_outline</mat-icon>
      <span class="action-label">Comment</span>
    </a>
    <button mat-button type="button">
      <mat-icon>share</mat-icon>
      <span class="action-label">Share</span>
    </button>
  </div>
</article>
